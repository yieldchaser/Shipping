# kb/series_map.yaml - P2 series loader map (deterministic)
# version 1 | source in {shipbrokers,hellenic,seabrokers,drewry_ais_pdfs,drybulk,tankers,baltic}
# mode in {wide,long} | provenance in {reported_table,chart_derived}
version: 1
series:
  - stem: advanced_shipping_demo_sales_series
    source: shipbrokers
    date_col: 'issue_date'
    mode: wide
    value_cols: ['dwt', 'ldt', 'yob', 'price_usd_per_ldt']
    entity_cols: ['vessel_name', 'vessel_type', 'country', 'comments']
    provenance: reported_table
  - stem: advanced_shipping_demolition_series
    source: shipbrokers
    date_col: 'issue_date'
    mode: wide
    value_cols: ['price_usd_per_ldt']
    entity_cols: ['country']
    provenance: reported_table
  - stem: advanced_shipping_newbuilding_series
    source: shipbrokers
    date_col: 'issue_date'
    mode: wide
    value_cols: ['capacity', 'capacity_raw', 'price_usd_mill']
    entity_cols: ['section', 'capacity_unit', 'price_raw', 'owner', 'comments']
    provenance: reported_table
  - stem: advanced_shipping_sales_series
    source: shipbrokers
    date_col: 'issue_date'
    mode: wide
    value_cols: ['DWT', 'TEU', 'CBM', 'BUILT', 'PRICE_USD_MILL']
    entity_cols: ['section', 'NAME', 'TYPE', 'YARD', 'M_E', 'GEAR', 'PRICE', 'BUYERS', 'SS', 'COMMENTS']
    provenance: reported_table
  - stem: advanced_shipping_secondhand_matrix_series
