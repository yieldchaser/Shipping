# Provider pool and price table for kb/llm_runner.py (plan §7.5, §10.3).
# Prices are USD per 1M tokens. Free capacity is used before paid.
# A provider price of null means "measure in P-1 (router probe) before first chargeable pass".
# The key is never stored here: the runner reads ROUTER_API_KEY (env) or
# refs.ENCLAVE_API_KEY / refs.ULTRAFAST_API_KEY from ~/.dsh/.credentials.yaml.

router:
  base_url: "https://router.enclave.ai/v1"     # ROUTER_BASE_URL overrides
  model_prefix: "cyberouter/"

providers:
  - id: enclave
    kind: paid
    base_url: "https://router.enclave.ai/v1"
    key_source: ENCLAVE_API_KEY                # refs key name in credentials file
    models:
      - id: deepseek-v4-pro
        price_in: 1.32
        price_out: 3.96
      - id: deepseek-v4-flash
        price_in: null                          # measured in P-1
        price_out: null
    concurrency_max: 48

  - id: ultrafast
    kind: free
    base_url: "https://ultrafast.trytokenfactory.dev/v1"
    key_source: ULTRAFAST_API_KEY
    daily_output_cap: 3000000                   # pipeline share of the 5M/day site budget (plan §11.1)
    models:
      - id: deepseek-v4.1-flash-1017-ultrafast
        price_in: 0.0
        price_out: 0.0
    concurrency_max: 1

  # AMD Token Lab (owner amendment to D10, 2026-11-13): the bulk extractor. `kind` is paid: the
  # route reports a real `usage.cost` and the tariff is measurable, so this is NOT free capacity.
  # Tariff fitted exactly (max abs err $0.000000) from 11 stored parity usages:
  #   in $0.28/M, cached in $0.0056/M, out $0.56/M  -> blended $0.001249/call, $0.00134/packed pack.
  # Full remaining scope (23,488 packed calls) ~= $31.5, booked under `p4c_bulk_extraction`.
  # Refusals arrive as HTTP 429 `model_concurrency_rate_limit_exceeded` (shared model ceiling 144),
  # never a per-key quota; the runner rotates the 8-account key pool and retries.
  - id: amd_tokenlab
    kind: paid
    base_url: "https://api.tokenlab.amd.com/v1"
    key_source: AMD_TOKENLAB_API_KEY
    rate_limit_per_min: 60
    models:
      - id: DeepSeek-V4.1-Flash
        price_in: 0.28
        price_cached: 0.0056
        price_out: 0.56
      - id: DeepSeek-V4-Flash
        price_in: 0.28
        price_cached: 0.0056
        price_out: 0.56
    concurrency_max: 8

  # NVIDIA NIM (free third provider, added owner commit 930fc99e92, AGENT_TASK §2.1).
  # OpenAI-compatible, full org/model ids (NO cyberouter/ prefix), $0. ~40 req/min per
  # account, 429 often without Retry-After -> exponential backoff. Probe before use.
  # Uses (never lower quality): (1) P4b bake-off candidates, (2) cross-family judges /
  # verifiers (Mistral + Nemotron differ in family from DeepSeek), (3) overflow routing.
  # NIM is NOT used for the coding agent itself.
  - id: nim
    kind: free
    base_url: "https://integrate.api.nvidia.com/v1"
    key_source: NVIDIA_API_KEY                  # refs key; env NVIDIA_API_KEY overrides
    rate_limit_per_min: 40
    models:
      - id: mistralai/mistral-large-4-1t-a52b
        price_in: 0.0
        price_out: 0.0
        note: judge-only; slow (60-115s, ~1k reasoning tok); timeout >= 180s
      - id: nvidia/nemotron-3-ultra-550b-a55b
        price_in: 0.0
        price_out: 0.0
        note: verified 2026-11-10; 2-6s
      # Candidates from owner tests (leads — verify in P-1/P4b, do not pre-pick):
      - id: nvidia/nemotron-3.5-super-vl-120b-a12b
        price_in: 0.0
        price_out: 0.0
        note: "fast ~0.4s first token, 1M ctx; chat_template_kwargs {\"enable_thinking\": false}"
      - id: stepfun-ai/step-5-preview
        price_in: 0.0
        price_out: 0.0
        note: lead only
      # nemotron-3.5-lightning-30b: EXCLUDED — hits max_tokens with empty content unless >= 8k
    concurrency_max: 4

# Pipeline hard caps (plan §10.3). The coding agent's own $60 is enforced by the gateway, not here.
budget:
  pipeline_cap_usd: 82
  agent_cap_usd: 60
  untouched_usd: 3
  # Booking after C1 owner reply 2026-02-19 (all remaining phase caps booked first, then the spare
  # of the $82 goes to a glm-5.3 second extractor on the highest-value chunks - owner decision 4).
  # REBOOKED 2026-11-13 (AMD Token Lab replaces free Ultrafast as the bulk route, owner amendment to
  # D10). AMD is NOT free: measured tariff $0.28/M in, $0.0056/M cached in, $0.56/M out = $0.00134
  # per real pack at the live cursor, $31.21 for all 24,978 packs. The $82 was booked on the premise
  # that the bulk pass cost $0, so real-cost bulk has to come out of the other bookings:
  #   - p4c_second_extractor 25.25 -> 0: the AMD bulk pass over every pack IS the second extractor.
  #   - escalation_plus_gleaning 17 -> 11: rule-6 escalation stays cap-prioritised (D12), no gate.
  #   - p4c_gleaning stays 0: blanket gleaning was funded only by spare budget (D11), there is none;
  #     gleaning is deferred to a post-C2 owner decision, not silently squeezed.
  # Every remaining sum is still 82.00 exactly. Gates are untouched; only coverage is prioritised.
  passes:
    router_probe_plus_bakeoff: 4.75        # measured spend to C1 (was 7 booked, 4.7543 spent)
    p4c_bulk_extraction: 31.25             # AMD Token Lab bulk, measured $0.00134/pack x 24,978
    p4c_gleaning: 0                        # deferred: no spare budget once bulk is priced honestly
    escalation_plus_gleaning: 11           # glm-5.3 rule-6 escalation, cap-prioritised (D12)
    p4c_second_extractor: 0                # superseded: the AMD bulk pass is the second extractor
    entity_adjudication: 4
    llm_prefixes: 1
    period_summaries: 13
    eval: 8
    rerun_reserve: 9                       # sum = 82.00 exactly
