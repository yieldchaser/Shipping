name: Data Expansion Collectors

on:
  schedule:
    # Mon-Thu 05:00 UTC, off-peak, clear of the 06:45/07:00/10:30 data jobs.
    - cron: '0 5 * * 1-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas beautifulsoup4 lxml openpyxl pyarrow fastparquet

      - name: Pull latest before run
        run: git pull --rebase --autostash origin main

      - name: SGX FFA history backfill
        continue-on-error: true
        timeout-minutes: 20
        run: if [ -f scripts/expansion_sgx_history_backfill.py ]; then python scripts/expansion_sgx_history_backfill.py; fi

      - name: World Bank commodity collector
        continue-on-error: true
        timeout-minutes: 20
        run: if [ -f scripts/expansion_worldbank_pinksheet.py ]; then python scripts/expansion_worldbank_pinksheet.py; fi

      - name: PortWatch congestion collector & Geospatial Caches
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -f scripts/expansion_portwatch.py ]; then python scripts/expansion_portwatch.py; fi
          if [ -f scripts/geospatial/build_chokepoint_cache.py ]; then python scripts/geospatial/build_chokepoint_cache.py; fi
          if [ -f scripts/geospatial/build_vessel_trajectories_cache.py ]; then python scripts/geospatial/build_vessel_trajectories_cache.py; fi

      - name: Bunker prices collector & Bunker Cache
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -f scripts/expansion_bunker_prices.py ]; then python scripts/expansion_bunker_prices.py; fi
          # Harvest the FULL published BIX series (each page embeds ~256 daily
          # chart points per grade) into the append/merge archive, then
          # accumulate + rebuild BEFORE the summary so bix_history.csv extends
          # daily and the embed carries the full series.
          if [ -f scripts/bunkers/bix_history_backfill.py ]; then python scripts/bunkers/bix_history_backfill.py; fi
          if [ -f scripts/bunkers/build_bix_history.py ]; then python scripts/bunkers/build_bix_history.py; fi
          if [ -f scripts/bunkers/build_bunker_cache.py ]; then python scripts/bunkers/build_bunker_cache.py; fi

      - name: Fearnleys Hasura Daily Sync & Cache
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ -f scripts/fearnleys/daily_fearnleys_sync.py ]; then python scripts/fearnleys/daily_fearnleys_sync.py; fi
          if [ -f scripts/fearnleys/build_comment_chunks.py ]; then python scripts/fearnleys/build_comment_chunks.py; fi
          # Fearnleys market-data service (fearnpulse /api/marketapi/TS): daily dry-route
          # assessments (Capesize/Panamax/Supramax routes). Refresh pulls ~14 days and
          # merge-upserts into fearnpulse_dry_routes_full.csv + fearnleys_dry_routes_daily.json.
          if [ -f scripts/fearnleys/fetch_dry_routes_ts.py ]; then python scripts/fearnleys/fetch_dry_routes_ts.py --refresh; fi
          # Daily tanker-routes UI cache (Broker Desk S3): rebuild from the just-refreshed
          # fearnpulse_rates_full.csv (the sync's 30-day Hasura delta keeps it live) —
          # no second API pull; --verify asserts the regression floors.
          if [ -f scripts/fearnleys/build_tanker_routes_daily.py ]; then python scripts/fearnleys/build_tanker_routes_daily.py --build --verify; fi

      - name: Geospatial voyage tracker (idempotent, additive-only)
        # Rebuilds lineup/voyage/UI-vector caches from existing fixture data only.
        # Idempotent: deterministic hashes + drop_duplicates; never deletes data/.
        # Graceful-fail: guarded by file-exists checks + continue-on-error.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -f scripts/geospatial/build_geospatial_tracker.py ]; then python scripts/geospatial/build_geospatial_tracker.py; fi
          if [ -f scripts/geospatial/build_vessel_leg_economics.py ]; then python scripts/geospatial/build_vessel_leg_economics.py; fi

      - name: Port stress matrix + cache (idempotent, additive-only)
        # compute_port_stress_matrix reads data/congestion/port_calls_daily.csv
        # (written by the PortWatch step above) and rewrites only its own two
        # outputs; build_port_stress_cache derives only from that matrix CSV.
        # Idempotent: pure recompute from the same inputs; graceful-fail guarded.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -f scripts/compute_port_stress_matrix.py ]; then python scripts/compute_port_stress_matrix.py; fi
          if [ -f scripts/congestion/build_port_stress_cache.py ]; then python scripts/congestion/build_port_stress_cache.py; fi

      - name: PortWatch expanded universe (2065 ports) refresh
        # scripts/scrapers/fetch_portwatch_ports_expanded.py --refresh:
        # masters (2065-port universe + 28 chokepoints) and the 132-event
        # disruptions feed are refreshed verbatim; the daily expanded table is
        # updated INCREMENTALLY (ArcGIS DATE literal: date > max stored in the
        # hot file). ObjectId-keyset pagination (no deep offsets - the layer
        # rejects them) + rate-limited pages keep the public service healthy.
        # Backfills of missing history (per-year shards) are manual runs of
        # --backfill (resumable: existing year outputs are skipped).
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if [ -f scripts/scrapers/fetch_portwatch_ports_expanded.py ]; then python scripts/scrapers/fetch_portwatch_ports_expanded.py --refresh; fi
          if [ -f scripts/geospatial/build_voyage_history.py ]; then python scripts/geospatial/build_voyage_history.py; fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A data/ docs/
          if git diff --staged --quiet; then
            echo "No expansion data changes to commit."
            exit 0
          fi

          git commit -m "data(expansion): update collector datasets $(date -u +'%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push race on attempt $attempt. Retrying in 10s..."
            sleep 10
          done

          echo "Failed to push after 3 attempts."
          exit 1
