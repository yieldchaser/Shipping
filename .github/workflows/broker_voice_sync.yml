name: Broker Voice Sync

# Keeps the Broker Desk "Broker Voice & Research Repository" current end to end:
# Fearnleys desk comments, research PDFs, fixtures, S&P deals and rates (Hasura),
# the comment archive chunks and summary cache built from them, and the Gibson
# research catalogue (WordPress REST). A freshness check then asks every source
# for its newest items and turns the run red if any is missing on main.

on:
  schedule:
    # Twice a day, every day: Fearnleys and Gibson publish on weekdays at varying hours.
    - cron: '20 7 * * *'
    - cron: '20 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # pymupdf/openpyxl/bs4: the Fearnleys-MD extraction and the corpus audit run here too (new reports land here)
        run: pip install requests pandas numpy pyarrow beautifulsoup4 lxml pymupdf==1.28.2 pillow openpyxl

      - name: Pull latest
        run: git pull --rebase --autostash origin main

      - name: Collect sources
        id: collect
        # Every collector runs even if an earlier one fails; failures are recorded
        # and fail the job only after whatever did succeed has been committed.
        run: |
          failed=""
          python scripts/fearnleys/daily_fearnleys_sync.py || failed="$failed daily_fearnleys_sync"
          python scripts/fearnleys/build_comment_chunks.py || failed="$failed build_comment_chunks"
          python scripts/scrapers/fetch_gibson_catalog.py || failed="$failed fetch_gibson_catalog"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          # new Fearnleys reports arrive here twice a day: extract them and refresh the corpus audit in the same
          # run (before, the MDs and the audit waited for the weekly Fearnleys job, up to 7 days)
          python scripts/acquire/cache_fearnleys_report_images.py --download-pdfs || echo "::warning::cache_fearnleys_report_images failed; the sync itself is committed, the extract/audit refresh waits for the next run"
          python scripts/extract/publishers/run_fearnleys_md_full_power.py || echo "::warning::run_fearnleys_md_full_power failed; the sync itself is committed, the extract/audit refresh waits for the next run"
          python scripts/verify/build_corpus_inventory.py --merge-existing || echo "::warning::build_corpus_inventory failed; the sync itself is committed, the extract/audit refresh waits for the next run"
          python scripts/sync_extraction_register.py || echo "::warning::sync_extraction_register failed; the sync itself is committed, the extract/audit refresh waits for the next run"
          # rejoin sentences the conversion split into paragraphs (only the MDs this run wrote)
          python scripts/md_cleanup/join_wrapped_paragraphs.py --changed --apply || true
          python scripts/audit/generate_cadence_audit.py || echo "::warning::generate_cadence_audit failed; the sync itself is committed, the extract/audit refresh waits for the next run"

      - name: Commit and push
        run: |
          python scripts/ci/protect_accepted_md.py
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for tpath in data/extracted/md/fearnleys-md data/extracted/series data/extracted/charts \
                       data/extracted/EXTRACTION_REGISTER.json docs/EXTRACTION_REGISTER.md \
                       corpus/_inventory_untracked.json corpus/CORPUS_REGISTRY_AND_CADENCE_AUDIT.md \
                       docs/CORPUS_CADENCE_AND_AUDIT.md corpus/CORPUS_PUBLICATION_CADENCE_AND_AUDIT.xlsx; do
            if [ -e "$tpath" ]; then git add "$tpath"; fi
          done
          git add data/derived/fearnleys_broker_comments.csv \
                  data/derived/fearnleys_comments_tanker.json data/derived/fearnleys_comments_dry.json \
                  data/derived/fearnleys_comments_gas.json data/derived/fearnleys_comments_snp.json \
                  data/derived/fearnleys_summary.json \
                  data/derived/fearnleys_fixtures_full.csv data/derived/fearnleys_fixtures_full.parquet \
                  data/derived/fearnleys_snp_transactions.csv data/derived/fearnpulse_rates_full.csv \
                  data/reports/fearnleys_reports_catalog.json \
                  data/reports/fearnleys corpus/01-brokers/fearnleys-md \
                  data/clarksons/gibson_all_reports_catalog.json
          if git diff --staged --quiet; then
            echo "No Broker Voice changes to commit."
            exit 0
          fi
          git commit -m "data(broker-voice): sync Fearnleys comments/reports and Gibson catalogue $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          # rebases over concurrent bot pushes; regenerated audit files may conflict, anything else fails
          bash scripts/ci/push_rebase.sh && exit 0
          exit 1

      - name: Fail if a collector failed
        if: steps.collect.outputs.failed != ''
        run: |
          echo "::error::Collectors failed:${{ steps.collect.outputs.failed }}"
          exit 1

      - name: Freshness check against live sources
        run: python scripts/verify/check_broker_voice_fresh.py
