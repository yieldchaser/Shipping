name: Scheduled Pipeline Sync & Derived Cache Builders

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-pipeline-sync
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Run Cargo & Congestion Cache Builders
        run: |
          python scripts/cargo/build_cargo_cache.py
          python scripts/cargo/build_commodity_flow_matrix.py
          python scripts/geospatial/build_chokepoint_cache.py
          python scripts/backtest_macro_health_radar.py
          python scripts/backfill_historical_data.py
          python scripts/scenario_snapshot_schema.py
          python scripts/verify/build_provenance_manifest.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/cargo/ data/congestion/ data/derived/ data/etf/snapshots/ data/provenance/
          if git diff --staged --quiet; then
            echo "No pipeline cache changes to commit."
            exit 0
          fi
          git commit -m "Auto-update derived cargo, chokepoint, and analytics caches [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
