name: FFA Live Recorder

# Records the live dry-bulk FFA market every 2 minutes on weekdays 02:30-18:30 UTC
# (Singapore late morning through the London close) into data/ffa_live/, pushing every 10 minutes when
# prices moved. The Broker Desk reads data/ffa_live/latest.json straight from
# raw.githubusercontent.com, so the page is never more than ~10-15 minutes behind
# the market without redeploying the site on every push.
#
# GitHub starts scheduled runs late on this repo, often by 4-6 hours (the 00:05 run on
# 2026-09-15 started at 04:46, the 12:05 run on 2026-09-14 at 18:03), so nothing here
# relies on a cron firing on time. The runs form one chain:
#   - a run inside the window records until the window closes or its 5h45m budget ends
#     (a job may run at most 6 hours), whichever comes first;
#   - a run outside the window (evening, weekend) waits for the next window, recording
#     if it opens within the budget;
#   - every run dispatches the next one before it exits (workflow_dispatch starts within
#     a minute or so), so recording starts at 02:30 on the dot each weekday;
#   - the crons only restart the chain if it ever breaks; runs share one concurrency
#     group, so a cron firing while the chain is alive queues and replaces any other queued run.

on:
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '5 9 * * 1-5'
    - cron: '5 12 * * 1-5'
    - cron: '5 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ffa-live-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/clarksons
            data/ffa_live
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Record session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_START: '02:30'
          WINDOW_END: '18:30'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          budget_end=$(( $(date -u +%s) + 345 * 60 ))
          # Next weekday window start at or after now, and its end, as epoch seconds.
          day=$(date -u +%F)
          for i in 0 1 2 3 4 5 6 7; do
            d=$(date -u -d "$day + $i day" +%F)
            [ "$(date -u -d "$d" +%u)" -gt 5 ] && continue
            ws=$(date -u -d "$d $WINDOW_START" +%s); we=$(date -u -d "$d $WINDOW_END" +%s)
            [ "$(date -u +%s)" -lt "$we" ] && break
          done
          if [ "$ws" -ge "$budget_end" ]; then
            echo "Next window opens $(date -u -d @$ws '+%a %H:%M') UTC, beyond this run; waiting out the budget."
            sleep $(( budget_end - $(date -u +%s) ))
            rc=0
          else
            now=$(date -u +%s)
            if [ "$now" -lt "$ws" ]; then
              echo "Waiting for the window to open at $(date -u -d @$ws '+%a %H:%M') UTC"
              sleep $(( ws - now ))
            fi
            stop=$(( budget_end < we ? budget_end : we ))
            UNTIL=$(date -u -d @$stop +%H:%M)
            echo "Recording until $UNTIL UTC"
            set +e
            python scripts/clarksons/ffa_live_recorder.py --interval 120 --push-every 600 --until "$UNTIL" --push
            rc=$?
            set -e
          fi
          gh workflow run ffa_live_recorder.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Dispatched the next run"
          exit $rc
