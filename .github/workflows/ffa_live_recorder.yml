name: FFA Live Recorder

# Records the live dry-bulk FFA market every 2 minutes on weekdays 00:05-18:30 UTC
# (Singapore morning through the London close) into data/ffa_live/, pushing every 10 minutes when
# prices moved. The Broker Desk reads data/ffa_live/latest.json straight from
# raw.githubusercontent.com, so the page is never more than ~10-15 minutes behind
# the market without redeploying the site on every push.
#
# GitHub starts scheduled runs late on this repo, often by 4-6 hours (the 00:05 run on
# 2026-09-15 started at 04:46, the 12:05 run on 2026-09-14 at 18:03), so the recording
# window is set by the clock, not by which cron fired:
#   - any run started inside the window records until the window closes or for 5h45m
#     (a job may run at most 6 hours), whichever comes first;
#   - a run that stops before the window closes dispatches the next run itself
#     (workflow_dispatch starts within a minute or so), so one chain covers the day;
#   - the crons only (re)start the chain; runs share one concurrency group, so a cron
#     firing while the chain is alive just queues and replaces any other queued run;
#   - a run started outside the window (weekend, after 18:30) exits at once.

on:
  schedule:
    - cron: '5 0 * * 1-5'
    - cron: '5 3 * * 1-5'
    - cron: '5 6 * * 1-5'
    - cron: '5 9 * * 1-5'
    - cron: '5 12 * * 1-5'
    - cron: '5 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ffa-live-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/clarksons
            data/ffa_live
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Record session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOW_START: '00:05'
          WINDOW_END: '18:30'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mins() { echo $((10#${1%%:*} * 60 + 10#${1##*:})); }
          now=$(mins "$(date -u +%H:%M)")
          start=$(mins "$WINDOW_START"); end=$(mins "$WINDOW_END")
          if [ "$(date -u +%u)" -gt 5 ] || [ "$now" -lt "$start" ] || [ "$now" -ge "$end" ]; then
            echo "Outside the recording window ($WINDOW_START-$WINDOW_END UTC, weekdays); nothing to do."
            exit 0
          fi
          stop=$(( now + 345 )); [ "$stop" -gt "$end" ] && stop=$end
          UNTIL=$(printf '%02d:%02d' $((stop / 60)) $((stop % 60)))
          echo "Recording until $UNTIL UTC"
          set +e
          python scripts/clarksons/ffa_live_recorder.py --interval 120 --push-every 600 --until "$UNTIL" --push
          rc=$?
          set -e
          if [ "$stop" -lt "$end" ]; then
            gh workflow run ffa_live_recorder.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Dispatched the next run"
          fi
          exit $rc
