name: FFA Live Recorder

# Records the live dry-bulk FFA market every 2 minutes on weekdays 00:05-18:30 UTC
# (Singapore morning through the London close) into data/ffa_live/, pushing every 10 minutes when
# prices moved. The Broker Desk reads data/ffa_live/latest.json straight from
# raw.githubusercontent.com, so the page is never more than ~10-15 minutes behind
# the market without redeploying the site on every push.
#
# A job may run at most 6 hours, so the day is split in three runs. Each stops
# at a fixed UTC time; a late-starting run simply records a shorter window.

on:
  schedule:
    - cron: '5 0 * * 1-5'     # Asia run, until 06:00 UTC
    - cron: '55 5 * * 1-5'    # London morning run, until 12:10 UTC
    - cron: '5 12 * * 1-5'    # afternoon run, until 18:30 UTC
  workflow_dispatch:
    inputs:
      until:
        description: 'Stop at HH:MM UTC'
        default: '18:30'

permissions:
  contents: write

concurrency:
  group: ffa-live-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/clarksons
            data/ffa_live
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Record session
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -n "${{ github.event.inputs.until }}" ]; then
            UNTIL="${{ github.event.inputs.until }}"
          elif [ "${{ github.event.schedule }}" = "5 0 * * 1-5" ]; then
            UNTIL="06:00"
          elif [ "${{ github.event.schedule }}" = "55 5 * * 1-5" ]; then
            UNTIL="12:10"
          else
            UNTIL="18:30"
          fi
          python scripts/clarksons/ffa_live_recorder.py --interval 120 --push-every 600 --until "$UNTIL" --push
