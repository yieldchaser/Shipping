name: Weekly Broker Reports Ingest

on:
  schedule:
    # Monday through Friday at 07:00 UTC and 18:00 UTC, plus Saturday at 08:00 UTC
    - cron: '0 7,18 * * 1-5'
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of pages to scrape'
        default: '5'

permissions:
  contents: write

concurrency:
  group: broker-reports-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pypdf pandas firecrawl-anydoc pymupdf pillow llama-parse nace-sdk openpyxl liteparse
          npm install -g @llamaindex/liteparse || true

      - name: Configure Git identity
        run: |
          git config user.name "broker-reports-bot"
          git config user.email "bot@shipping"

      - name: Pull latest
        run: git pull origin main --rebase || true

      - name: Scrape Multi-Broker Reports
        env:
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          NACE_API_KEY: ${{ secrets.NACE_API_KEY }}   # Nace NDI Parse when LlamaParse credits run out
        run: |
          PAGES="${{ github.event.inputs.pages || '5' }}"
          python scripts/scrapers/fetch_hsn_shipbrokers.py "$PAGES"
          python scripts/update_intermodal_tc_rates.py || true
          python scripts/scrapers/fetch_gibson_weekly.py || true
          python scripts/fearnleys/build_tanker_routes_daily.py --build --verify || true
          python scripts/build_views.py || true
          python scripts/extract_demolition_pdfs.py || true
          python scripts/extract/orchestrate_incremental_ingest.py || true
          # Intermodal finance page (stocks, bunkers, macro): merge new issues into the series CSVs
          python scripts/extract/publishers/run_intermodal_finance.py --new-only || true
          # Intermodal: rebuild tables the parse left as a header row only (new issues; checked against the PDF page)
          python scripts/md_cleanup/intermodal_table_rebuild.py --untracked --parse -j 2 --apply || true
          python scripts/md_cleanup/intermodal_chart_guess_note.py --apply || true
          python scripts/extract/publishers/run_ssy_charts.py --new-only --out-dir "$RUNNER_TEMP/ssy_charts" || true
          python scripts/extract/publishers/merge_ssy_charts.py --new-only --charts-dir "$RUNNER_TEMP/ssy_charts" || true
          python scripts/extract/publishers/run_ism_series.py --new-only || true
          # Agora: stack new issues' indicator tables into agora_indicators_series.csv (append-only)
          python scripts/extract/publishers/agora_series.py --new-only || true
          python scripts/extract/sync_digests.py || true
          # TODO: quality gate script does not exist yet
          python scripts/verify/build_corpus_inventory.py --merge-existing || true
          python scripts/sync_extraction_register.py || true
          python scripts/audit/generate_cadence_audit.py || true
          # Series that stopped joining new issues (the auto-join gap) show as a run warning
          python scripts/verify/series_freshness.py || echo "::warning::series_freshness: live series lag their publisher's newest parsed issue (see log)"

      - name: Commit & Push New Broker Reports
        run: |
          python scripts/ci/protect_accepted_md.py
          python scripts/ci/fidelity_gate.py || true
          for fpath in corpus/01-brokers data/extracted/charts; do
            if [ -e "$fpath" ]; then
              git add -f "$fpath" || true
            fi
          done
          for tpath in \
            corpus/_inventory_untracked.json \
            corpus/CORPUS_REGISTRY_AND_CADENCE_AUDIT.md \
            docs/CORPUS_CADENCE_AND_AUDIT.md \
            corpus/CORPUS_PUBLICATION_CADENCE_AND_AUDIT.xlsx \
            data/extracted/md \
            data/extracted/series \
            data/extracted/EXTRACTION_REGISTER.json \
            docs/EXTRACTION_REGISTER.md \
            data/extracted/llamaparse_banchero/_run_state.json \
            data/extracted/llamaparse_banchero_v2/_run_state.json \
            data/extracted/llamaparse_intermodal_full/_run_state.json \
            data/extracted/llamaparse_xclusiv/_run_state.json \
            data/derived \
            data/views \
            data/clarksons; do
            if [ -e "$tpath" ]; then
              git add "$tpath" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "No new broker reports found."
            exit 0
          fi
          git commit -m "data(broker-reports): ingest weekly market reports and update cadence audit [skip ci]"
          # rebases over concurrent bot pushes; regenerated audit files may conflict, anything else fails
          bash scripts/ci/push_rebase.sh && exit 0
          exit 1
