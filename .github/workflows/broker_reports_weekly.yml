name: Weekly Broker Reports Ingest

on:
  schedule:
    # Every Monday and Wednesday at 07:00 UTC
    - cron: '0 7 * * 1,3'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of pages to scrape'
        default: '5'

permissions:
  contents: write

concurrency:
  group: broker-reports-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf pandas

      - name: Configure Git identity
        run: |
          git config user.name "broker-reports-bot"
          git config user.email "bot@shipping"

      - name: Pull latest
        run: git pull origin main --rebase || true

      - name: Scrape Multi-Broker Reports
        run: |
          PAGES="${{ github.event.inputs.pages || '5' }}"
          python scripts/scrapers/fetch_hsn_shipbrokers.py "$PAGES"
          python scripts/update_intermodal_tc_rates.py

      - name: Commit & Push New Broker Reports
        run: |
          git add reports/broker_reports/ data/derived/intermodal_tc_rates.csv data/derived/broker_reports_checkpoint.json || true
          if git diff --staged --quiet; then
            echo "No new broker reports found."
            exit 0
          fi
          git commit -m "data(broker-reports): ingest weekly market reports [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          exit 1
