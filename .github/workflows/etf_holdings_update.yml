name: ETF Holdings Update (BDRY/BWET)

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 2 PM UTC Monday-Friday (after market open data is available)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update-holdings:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests yfinance numpy

    - name: Pull latest before run
      run: git pull --rebase --autostash origin main

    - name: Download and process ETF holdings & generate authoritative snapshot bundle
      run: python scripts/update_etf_holdings.py

    - name: Run Production Artifact Integrity Audit
      run: python scripts/verify_production_artifact_integrity.py

    - name: Run Decision Ticket Workflow unit tests
      run: python scripts/test_decision_ticket_workflow.py -v

    - name: Run Thesis Scenario Builder unit tests
      run: python scripts/test_thesis_scenario_builder.py -v

    - name: Run Production Scenario Workflow tests
      run: python scripts/test_production_scenario_workflow.py -v

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/etf/
        if git diff --staged --quiet; then
          echo "No ETF holdings or snapshot changes to commit."
          exit 0
        fi

        git commit -m "Update ETF holdings, snapshots, and provenance manifest $(date +'%Y-%m-%d %H:%M UTC')"

        for attempt in 1 2 3; do
          if git pull --rebase --autostash origin main && git push origin HEAD:main; then
            echo "Push succeeded on attempt $attempt."
            exit 0
          fi
          echo "Push race on attempt $attempt. Retrying in 10s..."
          sleep 10
        done

        echo "Failed to push after 3 attempts."
        exit 1
