name: Fast GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily Market Brief"
      - "Daily Knowledge Update"
      - "Process Knowledge Base"
      - "Ingest Market Reports"
      - "Daily Baltic Index Update"
      - "ETF Holdings Update (BDRY/BWET)"
      - "Alibra Forward Curves & Time Charter Poller"
      - "Baltic New Indices Update"
      - "Fearnleys Weekly TC Update"
      - "Data Expansion Collectors"
      - "Broker Voice Sync"
      - "Weekly Broker Reports Ingest"
      - "Offshore Seabreeze Monthly Pipeline"
      - "Weekly Poten Opinions & Drewry WCI Ingest"
      - "Scheduled Pipeline Sync & Derived Cache Builders"
      - "Upstream Physical Commodity Flows & Port Logistics"
      - "Weekly USDA Maritime & Freight Data Ingest"
      - "Monthly BPS Indonesia Coal Ingest"
      - "Weekly Signal Ocean Intelligence Ingest"
      - "Monthly CFTC Statements Ingest"
      - "Live ETF Quotes Poller (BDRY/BWET)"
      - "SEC Filings Weekly"
      - "Test Health (regression ratchet)"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Two jobs, as in GitHub's own Pages starter workflow. With upload and deploy
# in one job, deploy-pages asked for the artifact ~0.3 s after the upload
# finished and intermittently got an empty list ("No artifacts named
# github-pages were found"): 8 failed deploys between 2026-11-18 and 11-22.
# A separate job only starts once the upload is complete and listed.
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: pip install pandas

      - name: Build view layer
        # data/views/ is what the frontend reads. Without this step the views
        # ship frozen at whatever was last committed by hand - the Dashboard
        # showed "as of 2026-09-09" while BDI had 2026-09-11.
        run: python scripts/build_views.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Clean Heavy Folders Before Pages Packaging
        run: |
          # Internal planning and research notes are not part of the site.
          rm -rf docs/megaprompts docs/research docs/*.md docs/*.yaml docs/*.ipynb docs/*.docx
          rm -rf corpus data/extracted reports scratch knowledge/docs knowledge/trees knowledge/manifests .agents .claude .code-review-graph .codex .cursor .gemini .kiro .qoder .vscode
          # knowledge/derived is ~135 MB; the frontend only needs the compact
          # breakwave_signals.json (62 KB) from it. Deleting the heavy files but
          # keeping that one lets the Signals tab use its fast relative-path load
          # in production instead of falling back to an 88 MB signals.jsonl
          # download from raw.githubusercontent.com.
          rm -f knowledge/derived/signals.jsonl knowledge/derived/section_index.jsonl \
            knowledge/derived/topic_evidence.jsonl knowledge/derived/themes.jsonl \
            knowledge/derived/timelines.json
          # Raw and intermediate files the site never fetches (no served HTML/JS
          # names them; tests/test_pages_artifact.py checks this stays true).
          # They took the artifact to ~1.4 GB unpacked / 427 MB packed.
          find . -name '*.parquet' -not -path './.git/*' -delete
          rm -rf data/geospatial/history data/stashed_redundant_sources
          rm -f bunker_master_historical.csv data/bunkers/bunker_master_historical.csv \
            data/congestion/port_calls_daily*.csv data/congestion/port_calls_daily*.csv.gz \
            data/derived/fearnleys_fixtures_full.csv data/derived/fearnpulse_rates_full.csv \
            data/reference/fearnpulse_rates_full.csv data/equities/sec_master_filing_catalog.csv
          du -sh --exclude=.git . || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

