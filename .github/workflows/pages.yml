name: Fast GitHub Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Daily Market Brief"
      - "Daily Knowledge Update"
      - "Process Knowledge Base"
      - "Ingest Market Reports"
      - "Daily Baltic Index Update"
      - "ETF Holdings Update (BDRY/BWET)"
      - "Alibra Forward Curves & Time Charter Poller"
      - "Baltic New Indices Update"
      - "Fearnleys Weekly TC Update"
      - "Data Expansion Collectors"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Clean Heavy Folders Before Pages Packaging
        run: |
          rm -rf reports scratch knowledge/docs knowledge/derived knowledge/trees knowledge/manifests .agents .claude .code-review-graph .codex .cursor .gemini .kiro .qoder .vscode

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
