name: Scraper Smoke Tests & Upstream Primary Assertions

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target test suite (default: all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - brazil_comexstat
          - ppa_iron_ore
          - eia_crude
          - newcastle_coal
          - indonesia_coal
          - guinea_bauxite
          - tradestat_urea
          - psa_nickel
          - china_alumina
          - turkstat_bulk
          - comexstat_sugar_npk
          - australia_req
          - argentina_grain
          - usda_fas_sales
          - usda_fgis_inspections
          - usda_vessel_queues
          - world_steel
          - china_customs_demand
          - major_miners
  schedule:
    # Run every Wednesday at 04:00 UTC
    - cron: '0 4 * * 3'

permissions:
  contents: read
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml openpyxl pymupdf playwright pdfplumber
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run Real-Data Smoke Tests
        run: |
          TARGET="${{ inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET="all"; fi
          python scripts/verify/smoke_test_scrapers.py --target "$TARGET"

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Scraper Smoke Test Failure ($(date -u +'%Y-%m-%d'))" \
            --body "The automated scraper smoke test suite failed on branch \`${{ github.ref_name }}\`.\n\nRun details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease inspect the step logs and verify upstream endpoint availability or data contracts." \
            --label "bug" || true
