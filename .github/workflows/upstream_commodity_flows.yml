name: Upstream Physical Commodity Flows & Port Logistics

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 06:00 UTC
  push:
    branches: [main]
    paths: ['data/commodities/inbox/*.csv']   # a dropped GACC export is imported at once
  workflow_dispatch:
    inputs:
      comexstat_full:
        description: 'ComexStat depth: 0 = recent 3-month slice (fast); 1 = full 1997->live'
        required: false
        default: '0'
        type: choice
        options: ['0', '1']

permissions:
  contents: write
  issues: write

jobs:
  update-upstream-flows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml openpyxl xlrd pymupdf==1.28.2 playwright pdfplumber
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Scrape Newcastle Coal
        id: step_newcastle
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_newcastle_coal.py

      - name: Scrape Australia PPA Iron Ore
        id: step_ppa
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_australia_ppa.py

      - name: Scrape Major Miners Production
        id: step_miners
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_major_miners_production.py

      - name: Scrape Australia REQ Forecasts
        id: step_req
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_australia_req.py

      - name: Scrape US EIA Petroleum Exports
        id: step_eia
        continue-on-error: true
        timeout-minutes: 15
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/scrapers/fetch_eia_petroleum_exports.py

      - name: Scrape PortWatch Port Activity
        id: step_portwatch
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_portwatch_port_activity.py

      - name: Scrape EU ETS Carbon
        id: step_eu_ets
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_eu_ets_carbon.py

      - name: Scrape GACC Bauxite & Alumina
        id: step_gacc
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_gacc_bauxite_alumina.py

      - name: Scrape TurkStat Bulk Trade
        id: step_turkstat
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_turkstat_bulk.py

      - name: Scrape Minor Bulks
        id: step_minor_bulks
        continue-on-error: true
        timeout-minutes: 15
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/scrapers/fetch_minor_bulks.py

      - name: Scrape World Steel Production
        id: step_world_steel
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_world_steel_production.py

      # chinadata.live (fetch_china_customs_demand.py) retired its API in 2026-10; the GACC monthly bulletin
      # continues the same-scope HS lines and carries the bulletin tonnage and value series
      - name: Scrape China Customs Monthly Bulletin (GACC)
        id: step_china_demand
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_gacc_monthly_bulletin.py

      - name: Scrape Argentina Grain
        id: step_argentina_grain
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_argentina_grain.py

      - name: Scrape PSA Nickel
        id: step_psa_nickel
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_psa_nickel.py

      - name: Scrape India TradeStat
        id: step_india_tradestat
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_india_tradestat.py

      - name: Scrape Brazil ComexStat
        id: step_comexstat
        continue-on-error: true
        timeout-minutes: 15
        env:
          COMEXSTAT_FULL_HISTORY: ${{ inputs.comexstat_full || '0' }}
        run: python scripts/scrapers/fetch_comexstat_brazil.py

      - name: Scrape Brazil ComexStat exports by destination
        id: step_comexstat_dest
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/scrapers/fetch_comexstat_brazil_destinations.py

      - name: Import China partner files from the inbox
        id: step_china_inbox
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/scrapers/import_china_partner_inbox.py

      - name: Rebuild Frontend Cargo Cache
        if: always()
        run: python scripts/cargo/build_cargo_cache.py

      # Reports (issue + final step) but never blocks the commit: when it did, every run from 2026-09-21 to
      # 10-12 scraped new data, failed here, skipped the commit and threw the data away, so the feeds stayed
      # stale and the guard kept failing.
      - name: Check Data Freshness Guard
        id: step_freshness
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify/check_data_freshness.py --create-issue

      - name: Verify Miners Provenance
        run: python scripts/verify/verify_miners_provenance.py

      # A failing dataset is reverted on its own (the validator lists it) and every other dataset still commits;
      # the run is failed at the end. When this step blocked the commit, one bad series (world steel 2026-10)
      # discarded every scraped dataset each week, PPA September 2026 among them (2026-10-19 .. 11-01).
      - name: Validate Commodity Data Quality & Provenance
        id: step_validate
        continue-on-error: true
        run: python scripts/verify/validate_cargo_data.py --rejected-out "$RUNNER_TEMP/rejected_datasets.txt"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -s "$RUNNER_TEMP/rejected_datasets.txt" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              echo "Validator rejected $f: keeping the committed version"
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git checkout HEAD -- "$f"; else rm -f "$f"; fi
            done < "$RUNNER_TEMP/rejected_datasets.txt"
          fi
          git add data/commodities/ data/congestion/ data/derived/ data/cargo/ data/provenance/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update upstream commodity flows, port congestion and ton-mile matrix [skip ci]"
            bash scripts/ci/push_rebase.sh
          fi

      - name: Report Scraper Health & Enforce Non-Silent Failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import sys, subprocess
          steps = {
            'Newcastle Coal': '${{ steps.step_newcastle.outcome }}',
            'Pilbara Ports': '${{ steps.step_ppa.outcome }}',
            'Major Miners': '${{ steps.step_miners.outcome }}',
            'Australia REQ': '${{ steps.step_req.outcome }}',
            'EIA Petroleum': '${{ steps.step_eia.outcome }}',
            'PortWatch': '${{ steps.step_portwatch.outcome }}',
            'EU ETS Carbon': '${{ steps.step_eu_ets.outcome }}',
            'GACC Bauxite/Alumina': '${{ steps.step_gacc.outcome }}',
            'TurkStat Bulk': '${{ steps.step_turkstat.outcome }}',
            'Minor Bulks': '${{ steps.step_minor_bulks.outcome }}',
            'World Steel': '${{ steps.step_world_steel.outcome }}',
            'China Customs Bulletin': '${{ steps.step_china_demand.outcome }}',
            'Argentina Grain': '${{ steps.step_argentina_grain.outcome }}',
            'PSA Nickel': '${{ steps.step_psa_nickel.outcome }}',
            'India TradeStat': '${{ steps.step_india_tradestat.outcome }}',
            'Brazil ComexStat': '${{ steps.step_comexstat.outcome }}',
            'Brazil Destinations': '${{ steps.step_comexstat_dest.outcome }}',
            'China Partner Inbox': '${{ steps.step_china_inbox.outcome }}'
          }
          print('=================================================================')
          print('UPSTREAM COMMODITY FLOW SCRAPERS EXECUTION SUMMARY')
          print('=================================================================')
          for name, outcome in steps.items():
            print(f'{name:<24}: {outcome}')
          print('=================================================================')

          failed = [name for name, outcome in steps.items() if outcome == 'failure']
          if failed:
            print(f'ERROR: {len(failed)} scrapers failed: {failed}')
            title = f'Alert: Upstream Commodity Flow Failures ({len(failed)} scrapers)'
            body = 'The following scrapers encountered errors during the automated run:\n\n' + '\n'.join([f'- {f}' for f in failed])
            try:
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body, '--label', 'data-freshness'], check=False)
            except Exception as e:
              print('Could not create GitHub issue:', e)
            sys.exit(1)
          else:
            print('All upstream commodity scrapers succeeded!')
          "

      - name: Fail the run on rejected datasets
        if: always() && steps.step_validate.outcome == 'failure'
        run: |
          echo "Validator rejected datasets (reverted, not committed): see the Validate Commodity Data Quality step."
          cat "$RUNNER_TEMP/rejected_datasets.txt" 2>/dev/null || true
          exit 1

      - name: Fail the run on stale datasets
        if: always() && steps.step_freshness.outcome == 'failure'
        run: |
          echo "Freshness guard found stale datasets (see the Check Data Freshness Guard step and the data-freshness issue)."
          exit 1
