name: Upstream Physical Commodity Flows & Port Logistics

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 06:00 UTC
  workflow_dispatch:
    # One-shot backfill wiring (no auto-run): default scheduled run keeps full
    # depth (COMEXSTAT_FULL_HISTORY=1). Set comexstat_full=0 for a fast
    # recent-slice (2024+) run only. NOTE: full 1997->live ComexStat is
    # multi-hour (year-by-year slices, ~45s pacing + 429 backoff) — run LAST
    # and isolated per the step comment below.
    inputs:
      comexstat_full:
        description: 'ComexStat depth: 1 = full 1997->live (multi-hour pacing); 0 = recent 2024+ slice'
        required: false
        default: '1'
        type: choice
        options: ['1', '0']

jobs:
  update-upstream-flows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml openpyxl pymupdf

      - name: Run Upstream Commodity & Congestion Scrapers
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
        run: |
          # Paced, real-data-only scrapers. No `|| true`: a genuine failure must fail
          # the run so it is visible (data-provenance policy, 2026-08-25 audit).
          python scripts/scrapers/fetch_newcastle_coal.py
          python scripts/scrapers/fetch_ppa_iron_ore.py
          python scripts/scrapers/fetch_major_miners_production.py
          python scripts/scrapers/fetch_australia_req.py
          python scripts/scrapers/fetch_eia_petroleum_exports.py
          python scripts/scrapers/fetch_portwatch_port_activity.py
          python scripts/scrapers/fetch_eu_ets_carbon.py
          python scripts/scrapers/fetch_un_comtrade_bauxite.py
          # ComexStat is the most rate-limited (MDIC free tier); run LAST and isolated
          # so its 429 backoff does not block the others. A partial run still commits
          # the months it succeeded on (the scraper skips, never fakes).
          # Dispatch input comexstat_full (default 1): 1 = full 1997->live
          # year-by-year (multi-hour pacing); 0 = recent 2024+ slice only.
          # Scheduled runs have no inputs -> fall back to 1 (full depth).
          COMEXSTAT_FULL_HISTORY="${{ inputs.comexstat_full }}"; if [ -z "$COMEXSTAT_FULL_HISTORY" ]; then COMEXSTAT_FULL_HISTORY=1; fi; export COMEXSTAT_FULL_HISTORY; python scripts/scrapers/fetch_comexstat_brazil.py || echo "ComexStat rate-limited this run; will complete on a later paced run."
          # Regenerate diagnostic Capesize ton-mile matrix AFTER live Brazil (ComexStat)
          # + Guinea bauxite (UN Comtrade) inputs land. Empty-month policy: null, not
          # fallback flatline — the generator refuses to fabricate a matrix when no
          # source volumes exist (see generate_ton_mile_matrix.py).
          python scripts/scrapers/generate_ton_mile_matrix.py

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commodities/ data/congestion/ data/derived/
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update upstream commodity flows, port congestion and ton-mile matrix [skip ci]"
          # Concurrent scheduled runs can move main; pull --rebase before pushing
          # instead of failing with "fetch first" (which previously dropped a
          # whole run's data on the floor).
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push attempt $attempt failed (concurrent commit); retrying..."
            sleep 15
          done
