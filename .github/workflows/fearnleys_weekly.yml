name: Fearnleys Weekly TC Update

on:
  schedule:
    # Fearnleys publishes weekly TC editions on Wednesdays (tankers AM, dry bulk PM).
    # Run Wednesday afternoon at 15:45 UTC and Thursday morning catch-up at 07:45 UTC.
    - cron: '45 15 * * 3'
    - cron: '45 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  fearnleys-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_knowledge.txt

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml holidays numpy playwright pymupdf pillow openpyxl

      - name: Pull latest before run
        run: git pull --rebase --autostash origin main

      - name: Run Fearnleys TC collector + series cache
        run: |
          python scripts/fetch_fearnleys_tc.py
          if [ -f scripts/fearnleys/build_series_cache.py ]; then python scripts/fearnleys/build_series_cache.py; fi
          python scripts/fetch_fearnleys_reports.py || true
          python scripts/fearnleys/daily_fearnleys_sync.py || true
          python scripts/acquire/cache_fearnleys_report_images.py --download-pdfs || true
          python scripts/extract/publishers/run_fearnleys_md_full_power.py || true
          python scripts/extract/publishers/export_fearnleys_md_excel.py || true
          python scripts/fearnleys/build_fearnleys_cache.py
          python scripts/fearnleys/build_desk_caches.py
          python scripts/fearnleys/build_fixtures_tape.py
          python scripts/verify/build_corpus_inventory.py --merge-existing || true
          python scripts/sync_extraction_register.py || true
          python scripts/audit/generate_cadence_audit.py || true

      - name: Commit and push changes
        run: |
          python scripts/ci/protect_accepted_md.py
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for fpath in corpus/01-brokers/fearnleys-md data/extracted/charts; do
            if [ -e "$fpath" ]; then
              git add -f "$fpath" || true
            fi
          done
          for tpath in \
            data/derived \
            data/reports/fearnleys_reports_catalog.json \
            corpus/_inventory_untracked.json \
            corpus/CORPUS_REGISTRY_AND_CADENCE_AUDIT.md \
            docs/CORPUS_CADENCE_AND_AUDIT.md \
            corpus/CORPUS_PUBLICATION_CADENCE_AND_AUDIT.xlsx \
            data/extracted/md/fearnleys-md \
            data/extracted/series \
            data/extracted/EXTRACTION_REGISTER.json \
            docs/EXTRACTION_REGISTER.md; do
            if [ -e "$tpath" ]; then
              git add "$tpath" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "No Fearnleys TC changes to commit."
            exit 0
          fi

          git commit -m "Update Fearnleys TC rates and custom reports $(date -u +'%Y-%m-%d') UTC [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push race on attempt $attempt. Retrying in 10s..."
            sleep 10
          done

          echo "Failed to push after 3 attempts."
          exit 1
