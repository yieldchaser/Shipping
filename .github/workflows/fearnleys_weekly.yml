name: Fearnleys Weekly TC Update

on:
  schedule:
    # Fearnleys publishes weekly TC editions on Wednesdays (tankers AM, dry bulk PM).
    # Run Wednesday afternoon at 15:45 UTC and Thursday morning catch-up at 07:45 UTC.
    - cron: '45 15 * * 3'
    - cron: '45 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  fearnleys-weekly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements_knowledge.txt

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml holidays numpy playwright

      - name: Pull latest before run
        run: git pull --rebase --autostash origin main

      - name: Run Fearnleys TC collector + series cache
        run: |
          python scripts/fetch_fearnleys_tc.py
          if [ -f scripts/fearnleys/build_series_cache.py ]; then python scripts/fearnleys/build_series_cache.py; fi
          python scripts/fetch_fearnleys_reports.py || true
          python scripts/fearnleys/daily_fearnleys_sync.py || true
          python scripts/fearnleys/build_fearnleys_cache.py
          python scripts/fearnleys/build_desk_caches.py
          python scripts/fearnleys/build_fixtures_tape.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/derived/time_charter_rates_fearnleys.csv data/derived/fearnleys_series_monthly.json data/derived/fearnleys_*.json data/derived/fearnleys_*.csv data/derived/lng_charter_rates.csv data/derived/lpg_*.csv data/reports/fearnleys_reports_catalog.json
          if git diff --staged --quiet; then
            echo "No Fearnleys TC changes to commit."
            exit 0
          fi

          git commit -m "Update Fearnleys TC rates $(date -u +'%Y-%m-%d') UTC"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push race on attempt $attempt. Retrying in 10s..."
            sleep 10
          done

          echo "Failed to push after 3 attempts."
          exit 1
