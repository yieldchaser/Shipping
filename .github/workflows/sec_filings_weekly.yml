name: SEC Filings Weekly

on:
  schedule:
    # Sunday 05:17 UTC. GitHub crons run hours late; the 21-day lookback below absorbs that.
    - cron: '17 5 * * 0'
  workflow_dispatch:
    inputs:
      recent_days:
        description: 'Look back this many days for new filings'
        default: '21'

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  sec-filings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # EDGAR needs no API key; identity/user agent is set in scripts/acquire/fetch_sec_filings.py
        run: pip install edgartools sec2md requests beautifulsoup4 lxml

      - name: Pull latest before run
        run: git pull --rebase --autostash origin main

      - name: Fetch NEW SEC filings only (existing corpus files are never overwritten)
        run: |
          RECENT="${{ github.event.inputs.recent_days || '21' }}"
          python scripts/acquire/fetch_sec_filings.py --all --recent-days "$RECENT" --rate-limit 0.15 || true

      - name: Exhibits + table repair on the new files only
        run: |
          # New = untracked. Retries the exhibits of any new 6-K/8-K whose exhibit fetch failed above.
          git ls-files --others --exclude-standard corpus/10-companies | grep -E '/(6-K|8-K)/.*\.md$' \
            | xargs -r python scripts/acquire/backfill_sec_exhibits.py || true
          git ls-files --others --exclude-standard corpus/10-companies | grep -E '\.md$' \
            | xargs -r python scripts/acquire/repair_sec_markdown_tables.py || true

      - name: Commit and push new filings
        run: |
          python scripts/ci/protect_accepted_md.py
          for fpath in corpus/10-companies; do
            if [ -e "$fpath" ]; then
              git add -f "$fpath" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "No new SEC filings to commit."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Add new SEC filings $(date -u +'%Y-%m-%d') UTC [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push race on attempt $attempt. Retrying in 10s..."
            sleep 10
          done

          echo "Failed to push after 3 attempts."
          exit 1
