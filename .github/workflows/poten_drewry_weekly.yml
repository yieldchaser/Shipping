name: Weekly Poten Opinions & Drewry WCI Ingest

on:
  schedule:
    # Every Friday at 17:00 UTC (following Poten & Drewry weekly publication)
    - cron: '0 17 * * 5'
  workflow_dispatch:
    # One-shot Wayback backfill wiring (no auto-run): default weekly run only
    # appends the latest assessed print. Set backfill_2011=true to run
    # fetch_drewry_wci.py --backfill (2011->present, assessed snapshots only,
    # gaps stay null, never synthesized).
    inputs:
      backfill_2011:
        description: 'One-shot Wayback backfill 2011->present (no synthesis)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: poten-drewry-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Configure Git identity
        run: |
          git config user.name "poten-drewry-bot"
          git config user.email "bot@shipping"

      - name: Pull latest
        run: git pull origin main --rebase || true

      - name: Run Drewry & Poten Ingestion
        run: |
          if [ "${{ inputs.backfill_2011 }}" = "true" ]; then
            python scripts/scrapers/fetch_drewry_wci.py --backfill || true
          else
            python scripts/scrapers/fetch_drewry_wci.py || true
          fi
          python scripts/scrapers/fetch_poten_direct.py || true

      - name: Commit & Push New Data
        run: |
          git add data/indices/ reports/drewry/ reports/poten/ data/derived/ || true
          if git diff --staged --quiet; then
            echo "No new Poten or Drewry data changes."
            exit 0
          fi
          git commit -m "data(poten-drewry): update weekly container WCI and tanker opinions [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          exit 1
