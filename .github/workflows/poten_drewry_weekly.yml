name: Weekly Poten Opinions & Drewry WCI Ingest

on:
  schedule:
    # Every Friday at 17:00 UTC (following Poten & Drewry weekly publication)
    - cron: '0 17 * * 5'
  workflow_dispatch:
    # One-shot Wayback backfill wiring (no auto-run): default weekly run only
    # appends the latest assessed print. Set backfill_2011=true to run
    # fetch_drewry_wci.py --backfill --max-snapshots 50 --limit-per-pattern 200
    # (newest 50 assessed snapshots only, gaps stay null, never synthesized;
    # job timeout-minutes 15 + script deadline/circuit-breaker keep it fail-soft).
    inputs:
      backfill_2011:
        description: 'One-shot Wayback backfill 2011->present (no synthesis)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: poten-drewry-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Fail-soft bound: archive.org throttling must never wedge the job
    # (run 33751576848 stuck 45m+ on Wayback ConnectTimeout/Connection refused).
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas pymupdf pillow openpyxl llama-parse

      - name: Configure Git identity
        run: |
          git config user.name "poten-drewry-bot"
          git config user.email "bot@shipping"

      - name: Pull latest
        run: git pull origin main --rebase || true

      - name: Run Drewry & Poten Ingestion
        env:
          DREWRY_COOKIE: ${{ secrets.DREWRY_COOKIE }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
        run: |
          if [ "${{ inputs.backfill_2011 }}" = "true" ]; then
            python scripts/scrapers/fetch_drewry_wci.py --backfill --max-snapshots 50 --limit-per-pattern 200 || true
          else
            python scripts/scrapers/fetch_drewry_wci.py || true
          fi
          # Poten's step is deliberately NOT `|| true`: the crawl's exit code
          # and its whole log are captured, and a final step asserts the
          # listing parsed and the catalog is non-empty. A silent zero already
          # cost this project a multi-week collection outage (2026-08-29..
          # 2026-09-30) while every run concluded `success`.
          poten_rc=0
          python scripts/scrapers/fetch_poten_direct.py > poten_run.log 2>&1 || poten_rc=$?
          echo "poten_rc=$poten_rc" >> "$GITHUB_ENV"
          cat poten_run.log
          python scripts/scrapers/fetch_drewry_canva_indices.py || true
          python scripts/scrapers/fetch_drewry_ais_weekly.py || true
          python scripts/scrapers/fetch_drewry_opinions_incremental.py || true
          python scripts/extract/publishers/run_drewry_opinions.py || true
          python scripts/extract/publishers/run_drewry_ais_charts.py || true
          python scripts/extract/publishers/run_drewry_ais.py || true
          python scripts/extract/publishers/run_poten.py || true
          python scripts/verify/build_corpus_inventory.py --merge-existing || true
          python scripts/sync_extraction_register.py || true
          python scripts/audit/generate_cadence_audit.py || true

      - name: Commit & Push New Data
        run: |
          for fpath in corpus/06-drewry corpus/04-poten data/extracted/charts reports/drewry/ais_manifest.csv; do
            if [ -e "$fpath" ]; then
              git add -f "$fpath" || true
            fi
          done
          for tpath in \
            data/indices \
            data/clarksons \
            data/derived \
            corpus/_inventory_untracked.json \
            corpus/CORPUS_REGISTRY_AND_CADENCE_AUDIT.md \
            docs/CORPUS_CADENCE_AND_AUDIT.md \
            corpus/CORPUS_PUBLICATION_CADENCE_AND_AUDIT.xlsx \
            data/extracted/md/drewry \
            data/extracted/md/poten \
            data/extracted/series \
            data/extracted/EXTRACTION_REGISTER.json \
            docs/EXTRACTION_REGISTER.md; do
            if [ -e "$tpath" ]; then
              git add "$tpath" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "No new Poten or Drewry data changes."
            exit 0
          fi
          git commit -m "data(poten-drewry): update weekly container WCI, AIS analytics, maritime opinions, and cadence audit [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          exit 1

      # A zero here must never pass silently again. Three measured failure
      # modes looked identical from the outside: an HTTP 403 from poten.com,
      # an empty listing parse, and a Python-3.11 SyntaxError in the script
      # itself (2026-09-11..2026-09-30 - the module raised before it ran on
      # the runner while this box's 3.14 executed the same file fine).
      - name: Assert the Poten collection actually ran
        if: always()
        run: |
          if [ ! -f poten_run.log ]; then
            echo "poten_run.log absent - the ingestion step did not run; nothing to assert."
            exit 0
          fi
          echo "poten exit code: ${poten_rc:-unknown}"
          if ! grep -qE '^Found [1-9][0-9]* articles on page 1' poten_run.log; then
            echo "::error::poten: the Tanker Opinions listing yielded NO articles this run - the crawler never reached or never parsed the listing, so corpus/04-poten is not being extended. Last lines of the crawl log:"
            tail -20 poten_run.log
            exit 1
          fi
          if grep -q 'Total in catalog: 0' poten_run.log; then
            echo "::error::poten: the crawl finished with an EMPTY catalog."
            tail -20 poten_run.log
            exit 1
          fi
          echo "poten: the listing parsed and the catalog is non-empty."
