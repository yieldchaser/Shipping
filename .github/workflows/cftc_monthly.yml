name: Monthly CFTC Statements Ingest

on:
  schedule:
    # Amplify publishes prior-month statements mid-month; probe on the 15th, 20th, 25th + weekly Mondays
    - cron: '0 7 15,20,25 * *'
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cftc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch new Amplify statements
        run: |
          python scripts/acquire/fetch_cftc_statements.py --months 3

      - name: Rebuild CFTC ledgers
        run: |
          python scripts/parse_cftc_monthly_statements.py

      - name: Commit and Push Changes (Idempotent)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cftc_statements/raw_pdf data/cftc_statements/parsed
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update CFTC monthly statements [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed; retrying..."
              sleep 15
            done
          fi
