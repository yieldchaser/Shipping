name: Offshore Seabreeze Monthly Pipeline

on:
  schedule:
    # Run twice weekly (Monday & Thursday at 06:30 UTC)
    - cron: '30 6 * * 1,4'
    # Run daily during the first week of the month (1st–8th at 08:00 UTC) when new Seabreeze editions drop
    - cron: '0 8 1-8 * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force re-download and re-digest all reports: true | false'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: offshore-seabrokers-pipeline
  cancel-in-progress: false

jobs:
  offshore-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_knowledge.txt

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf pandas numpy lxml openpyxl llama-parse nace-sdk pillow

      - name: Configure Git identity
        run: |
          git config user.name "offshore-bot"
          git config user.email "bot@shipping"

      - name: Pull latest
        run: git pull --rebase --autostash origin main || true

      - name: Run Seabrokers Harvester & Cache Builder
        env:
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          NACE_API_KEY: ${{ secrets.NACE_API_KEY }}   # Nace NDI Parse when LlamaParse credits run out
        run: |
          if [ "${{ github.event.inputs.force_all }}" = "true" ]; then
            python scripts/scrapers/fetch_seabrokers_reports.py --all
          else
            python scripts/scrapers/fetch_seabrokers_reports.py --auto
          fi
          python scripts/offshore/build_offshore_cache.py
          python scripts/extract/publishers/run_seabrokers_llamaparse.py || true
          # availability chart: values from the chart's vector geometry, not the parser's eyeball read (new issues)
          python scripts/md_cleanup/seabrokers_availability_vector.py --untracked --apply || true
          # stack new issues' tables into the seabrokers_* series (append-only; reads the .tables.json sidecars)
          python scripts/extract/publishers/seabrokers_series.py --new-only || true
          python scripts/verify/build_corpus_inventory.py --merge-existing || true
          python scripts/sync_extraction_register.py || true
          python scripts/audit/generate_cadence_audit.py || true

      - name: Commit and Push Offshore Updates
        env:
          ALLOW_MD_REWRITE: ${{ github.event.inputs.force_all == 'true' && '1' || '' }}
        run: |
          python scripts/ci/protect_accepted_md.py
          python scripts/ci/fidelity_gate.py || true
          for fpath in corpus/05-seabrokers data/extracted/charts reports/seabrokers_catalog.json; do
            if [ -e "$fpath" ]; then
              git add -f "$fpath" || true
            fi
          done
          for tpath in \
            data/reports/seabrokers_catalog.json \
            data/derived \
            data/extracted/llamaparse_seabrokers/_run_state.json \
            corpus/_inventory_untracked.json \
            corpus/CORPUS_REGISTRY_AND_CADENCE_AUDIT.md \
            docs/CORPUS_CADENCE_AND_AUDIT.md \
            corpus/CORPUS_PUBLICATION_CADENCE_AND_AUDIT.xlsx \
            data/extracted/md/seabrokers \
            data/extracted/series \
            data/extracted/EXTRACTION_REGISTER.json \
            docs/EXTRACTION_REGISTER.md; do
            if [ -e "$tpath" ]; then
              git add "$tpath" || true
            fi
          done
          if git diff --staged --quiet; then
            echo "No new Seabreeze reports or offshore rate changes to commit."
            exit 0
          fi

          git commit -m "data(offshore): ingest latest Seabreeze market report, dayrate series, and update cadence audit [skip ci]"

          # rebases over concurrent bot pushes; regenerated audit files may conflict, anything else fails
          bash scripts/ci/push_rebase.sh && exit 0

          echo "Failed to push after 3 attempts."
          exit 1
