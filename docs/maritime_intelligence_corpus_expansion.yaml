# NOTES / FLAGGED GAPS (sources examined but NOT recommended as-is)
# ============================================================
# - allied_shipbroking (direct, allied-shipbroking.gr): full weekly PDF is now email-gated
#   ("Fill in the form below to subscribe"). Use the Cyprus Shipping News / Hellenic mirrors instead.
# - BIMCO full Shipping Market Overview & Outlook PDF: member-gated; only the "Shipping Number
#   of the Week" excerpts and video summaries are genuinely free.
# - Banchero Costa, Gibson, Intermodal, Xclusiv, Poten direct-owned PDFs were all located, but
#   Hellenic Shipping News' "Weekly Shipbrokers Reports" category is the most durable single
#   ingestion point since brokers rotate/gate their own hosting more often than the mirror does.
# - Panama Canal Authority "Vessel Requirements" (N01-YYYY) notices supplement the Advisories
#   and should be pulled from the same /wp-content/uploads/ directory pattern.
# - Recommend a second research pass (live browser fetch) on: Commodore Research, Arrow
#   Shipbroking, BRS Group annual overviews, Cleaves Securities, Signal Ocean whitepapers,
#   USGS Mineral Commodity Summaries, GACC customs releases, and Suez Canal Authority transit
#   circulars — these were identified as high-value targets but require direct-site fetch_url
#   verification beyond search-snippet coverage to confirm current live, non-paywalled URLs.
